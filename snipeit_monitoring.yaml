    - uuid: 960493cf128f4d8b8bd5bd34379a449c
      name: Open maintenances
      type: DEPENDENT
      key: sklad.maintenances.open
      history: 600d
      description: Number of maintenance records without a completion date.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var rows = JSON.parse(value).body.rows;

          var n = 0;

          for (var i = 0; i < rows.length; i++) { if (rows[i].completion_date === null) { n++; } }

          return n;'
      master_item:
        key: sklad.maintenances.parsing
      tags:
      - tag: component
        value: maintenance
    discovery_rules:
