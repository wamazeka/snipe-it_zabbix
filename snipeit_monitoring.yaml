        name: Category {#NAME} count
        type: DEPENDENT
        key: sklad.categories.count.[{#NAME}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..[?(@.name=='{#NAME}')].assets_count
        - type: TRIM
          parameters:
          - '[]'
        master_item:
          key: sklad.categories.parsing
      master_item:
        key: sklad.categories.parsing
      preprocessing:
      - type: JSONPATH
        parameters:
        - $..rows[:]
      - type: STR_REPLACE
        parameters:
        - '"name"'
        - '"{#NAME}"'
