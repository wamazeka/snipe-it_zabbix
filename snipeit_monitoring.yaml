  - uuid: 3cc9c036b80f413ab76ee38e3bbb1b4a
    template: Snipe-IT monitoring
    name: Snipe-IT monitoring
    description: 'Inventory and maintenance monitoring of a Snipe-IT asset management system via its REST
      API (Zabbix HTTP agent items).


      Metrics: totals of assets, users, licenses, models, accessories, components, consumables, locations,
      suppliers, manufacturers and maintenance records (total and open). Discovery of categories and status
      labels with per-label asset counts. Discovery of open maintenances with their age in days and warning/critical
      triggers for stale records.


      Setup:

      1. Create an API token in Snipe-IT (User -> API Keys) and put it into the {$SNIPEIT_TOKEN} macro
      on the host.

      2. Set {$SNIPEIT_URL} to the base URL of the instance.

      3. Tune {$SNIPEIT.MAINT.AGE.WARN}/{$SNIPEIT.MAINT.AGE.CRIT} thresholds (days) if needed.


      API reference: https://snipe-it.readme.io/reference/api-overview'
