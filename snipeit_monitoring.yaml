    - name: Web
    items:
    - uuid: 64a51243e7a94724a589554a074054f4
      name: Assets
      type: HTTP_AGENT
      key: sklad.assets
      delay: 12h
      history: 600d
      description: Total number of assets (hardware) registered in Snipe-IT.
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.total
      url: '{$SNIPEIT_URL}/api/v1/hardware'
      headers:
      - name: Accept
        value: application/json
      - name: Content-Type
        value: application/json
      - name: Authorization
        value: Bearer {$SNIPEIT_TOKEN}
      output_format: JSON
      verify_peer: 'YES'
      status_codes: '200'
      timeout: '{$SNIPEIT.HTTP_TIMEOUT}'
      tags:
      - tag: component
        value: total
    - uuid: 126f1cbc385b40f19fd1a1c88b593435
