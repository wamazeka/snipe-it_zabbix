    - uuid: a6c4db35b76c48afb6c7ac4ba57b9453
      name: Open maintenances discovery
      type: DEPENDENT
      key: sklad.maintenances.discovery
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      description: Discovers asset maintenances that have no completion date yet. Completed records drop
        out of discovery and their entities are removed after the lifetime (7d).
      item_prototypes:
      - uuid: 01c00e48b7694e9692fcac9b1c8a5501
        name: Maintenance {#MAINT.ID} "{#MAINT.TITLE}" age
        type: DEPENDENT
        key: sklad.maint.age[{#MAINT.ID}]
        history: 90d
        trends: '0'
        value_type: UNSIGNED
        units: d
        description: 'Age of the open maintenance in days: now() minus start_date. Asset: {#MAINT.ASSET}
          ({#MAINT.ASSET_TAG}), type: {#MAINT.TYPE}, started: {#MAINT.START}.'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $..rows[?(@.id=={#MAINT.ID})].start_date.datetime
        - type: JAVASCRIPT
          parameters:
          - 'var m = JSON.parse(value);

            if (!m || !m.length) { return ''''; }

            var t = new Date(String(m[0]).replace('' '', ''T'') + ''Z'').getTime();

            if (isNaN(t)) { return ''''; }

            var days = Math.floor((Date.now() - t) / 86400000);

            return days < 0 ? 0 : days;'
        master_item:
          key: sklad.maintenances.parsing
        trigger_prototypes:
        - uuid: 8dd39b083e8241b5be59bd80426a32ff
          expression: last(/Snipe-IT monitoring/sklad.maint.age[{#MAINT.ID}])>{$SNIPEIT.MAINT.AGE.CRIT}
          name: Maintenance "{#MAINT.TITLE}" (asset {#MAINT.ASSET}) takes over {$SNIPEIT.MAINT.AGE.CRIT}
            days
          priority: HIGH
          description: The maintenance has been open for more than {$SNIPEIT.MAINT.AGE.CRIT} days. Check
            that the work is progressing or close the record in Snipe-IT.
          opdata: 'Age: {ITEM.LASTVALUE1}'
          manual_close: 'YES'
          tags:
          - tag: scope
            value: notice
        - uuid: f51f0ea7634b481497ffcd0c5c677127
          expression: last(/Snipe-IT monitoring/sklad.maint.age[{#MAINT.ID}])>{$SNIPEIT.MAINT.AGE.WARN}
          name: Maintenance "{#MAINT.TITLE}" (asset {#MAINT.ASSET}) takes over {$SNIPEIT.MAINT.AGE.WARN}
            days
          priority: WARNING
          description: The maintenance has been open for more than {$SNIPEIT.MAINT.AGE.WARN} days. Escalates
            to High once {$SNIPEIT.MAINT.AGE.CRIT} days are exceeded.
          opdata: 'Age: {ITEM.LASTVALUE1}'
          manual_close: 'YES'
          dependencies:
          - name: Maintenance "{#MAINT.TITLE}" (asset {#MAINT.ASSET}) takes over {$SNIPEIT.MAINT.AGE.CRIT}
              days
            expression: last(/Snipe-IT monitoring/sklad.maint.age[{#MAINT.ID}])>{$SNIPEIT.MAINT.AGE.CRIT}
          tags:
          - tag: scope
            value: notice
        tags:
        - tag: component
          value: maintenance
      graph_prototypes:
      - uuid: c853608968c34c94bdbfdd42622450fa
        name: Maintenance {#MAINT.ID} "{#MAINT.TITLE}" age
        graph_items:
        - drawtype: BOLD_LINE
          color: F63100
          item:
            host: Snipe-IT monitoring
            key: sklad.maint.age[{#MAINT.ID}]
      master_item:
        key: sklad.maintenances.parsing
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "var d = JSON.parse(value).body;\nvar out = [];\nfor (var i = 0; i < d.rows.length; i++) {\n\
          \    var r = d.rows[i];\n    if (r.completion_date !== null) { continue; }\n    out.push({\n\
          \        '{#MAINT.ID}': String(r.id),\n        '{#MAINT.TITLE}': r.title || '',\n        '{#MAINT.ASSET}':\
          \ r.asset ? (r.asset.name || '') : '',\n        '{#MAINT.ASSET_TAG}': r.asset ? (r.asset.asset_tag\
          \ || '') : '',\n        '{#MAINT.TYPE}': r.asset_maintenance_type || '',\n        '{#MAINT.START}':\
          \ r.start_date ? (r.start_date.datetime || '') : ''\n    });\n}\nreturn JSON.stringify(out);"
      tags:
      - tag: component
        value: maintenance
    macros:
    - macro: '{$SNIPEIT_URL}'
      description: Snipe-IT base URL, e.g. https://snipeit.example.com
    - macro: '{$SNIPEIT_TOKEN}'
      type: SECRET_TEXT
      description: 'Snipe-IT API token (Bearer). Create in Snipe-IT: user profile -> API Keys.'
    - macro: '{$SNIPEIT.HTTP_TIMEOUT}'
      value: 15s
      description: Timeout of every HTTP request to the API.
    - macro: '{$SNIPEIT.MAINT.AGE.WARN}'
      value: '30'
      description: Warning threshold for the age of an open maintenance, days.
    - macro: '{$SNIPEIT.MAINT.AGE.CRIT}'
      value: '90'
      description: Critical threshold for the age of an open maintenance, days.
    - macro: '{$SNIPEIT.MAINT.LIMIT}'
      value: '1000'
      description: Maximum number of maintenance records fetched per poll (API "limit" parameter).
